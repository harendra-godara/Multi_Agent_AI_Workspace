openapi: 3.0.3
info: {title: Multi-Agent AI Workspace REST API, version: 1.0.0}
servers: [{url: http://localhost:3000}]
paths:
  /auth/register:
    post:
      responses: {'201': {description: User created}, '400': {description: Malformed request}, '409': {description: User exists}, '422': {description: Validation}}
  /auth/login:
    post:
      responses: {'200': {description: Authenticated}, '401': {description: Invalid credentials}}
  /auth/me:
    get:
      responses: {'200': {description: Current user}, '401': {description: Unauthenticated}}
  /workspaces:
    post:
      responses: {'201': {description: Workspace created}, '401': {description: Unauthenticated}, '422': {description: Validation}}
    get:
      responses: {'200': {description: Workspace list}, '401': {description: Unauthenticated}}
  /tasks:
    post:
      responses: {'201': {description: Task created}, '400': {description: Malformed request}, '401': {description: Unauthenticated}, '403': {description: Forbidden}, '422': {description: Validation}}
    get:
      responses: {'200': {description: Task list}, '401': {description: Unauthenticated}}
  /tasks/{id}:
    get:
      responses: {'200': {description: Task}, '401': {description: Unauthenticated}, '404': {description: Not found}}
    patch:
      responses: {'200': {description: Updated}, '401': {description: Unauthenticated}, '404': {description: Not found}, '409': {description: Conflict}, '412': {description: Precondition failed}, '422': {description: Validation}}
  /tasks/{id}/run:
    post:
      responses: {'202': {description: Workflow accepted}, '401': {description: Unauthenticated}, '403': {description: Forbidden}, '404': {description: Not found}, '409': {description: Illegal transition}, '422': {description: Validation}, '429': {description: Rate limited}, '503': {description: Dependency unavailable}}
components:
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties: {field: {type: string}, message: {type: string}}
